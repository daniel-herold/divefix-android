name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DiveFix-${{ github.run_number }}.apk
          gh release create build-${{ github.run_number }} DiveFix-${{ github.run_number }}.apk --target ${{ github.sha }} --title "DiveFix build ${{ github.run_number }}" --notes "Built from ${{ github.sha }}"
